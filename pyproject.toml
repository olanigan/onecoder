[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "onecoder"
version = "0.1.0"
requires-python = ">=3.11"
description = "OneCoder: harness-agnostic governance for coding agents (contract, policy, deterministic gates, review skills)."
readme = "README.md"
dependencies = []

[project.scripts]
onecoder = "onecoder.cli:main"

[tool.setuptools.packages.find]
include = ["onecoder*"]
